<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fun Games Collection - Inspired by Neal.fun</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="container">
            <h1 class="logo">🎮 FunGames</h1>
            <p class="tagline">A collection of useless but addictive web games</p>
        </div>
        <section class="search-section">
            <div class="container">
                <div class="search-bar">
                    <input type="text" id="search-input" placeholder="Search games... ">
                    <div class="search-count">Showing <span id="game-count">0</span> games</div>
                </div>
            </div>
        </section>
    </header>

    <!-- Games Grid -->
    <main class="main">
        <div class="container">
            <div class="games-grid" id="games-grid">
                <!-- Games will be inserted here by JavaScript -->
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <p>| Made by lmao |</p>
            <p class="footer-links">
                <a href="#">About</a> • 
                <a href="#">Suggest a Game</a> • 
            </p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
